name: Verify strategic continuity and A/B plumbing
on:
  push:
    branches: [feature/inferno-strategic-continuity-20261016]
    paths: [.strategy/ready.txt]
permissions:
  contents: write
jobs:
  verified-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply exact source patch
        run: |
          set -euo pipefail
          mkdir -p /tmp/inferno-strategy-tests
          python - <<'PY'
          from pathlib import Path
          import hashlib, lzma, base64
          parts=sorted(Path('.strategy').glob('part*.b64'))
          assert len(parts)==3, parts
          patch=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          expected='19fcd7daed5ec37f3627a2b8152f22eb01a811ea76ad36741153eb12f64aac18'
          assert hashlib.sha256(patch).hexdigest()==expected, 'Source patch hash mismatch'
          Path('/tmp/inferno-strategy.patch').write_bytes(patch)
          print('verified patch bytes:',len(patch))
          PY
          git apply --check /tmp/inferno-strategy.patch
          git apply /tmp/inferno-strategy.patch
          git diff --check
      - name: Install test and tokenizer dependencies
        run: python -m pip install -e '.[dev]' tiktoken
      - name: Full regression suite
        run: |
          set -o pipefail
          python -m compileall -q src examples benchmarks
          python -m pytest -q 2>&1 | tee /tmp/inferno-strategy-tests/pytest.txt
      - name: Strategy-notebook A/B routing and input overhead
        run: |
          set -euo pipefail
          PYTHONPATH=src python benchmarks/strategy_ab.py --scenario A --seeds 42 43 --max-actions 500 --stub --out /tmp/inferno-strategy-tests/paired-stub.json
          PYTHONPATH=src python benchmarks/strategy_memory_overhead.py --out /tmp/inferno-strategy-tests/overhead.json
      - name: Self-play all scenario smoke tests
        run: |
          set -euo pipefail
          for scen in A B C D E F; do
            PYTHONPATH=src python selfplay_bughunt.py "$scen" --seed 11 --max-steps 8000 > "/tmp/inferno-strategy-tests/smoke-$scen.txt"
            tail -4 "/tmp/inferno-strategy-tests/smoke-$scen.txt"
          done
      - name: Save/load, card-effect and adversarial stress
        run: |
          set -euo pipefail
          PYTHONPATH=src python cardfx_fuzz.py --seeds 3 | tee /tmp/inferno-strategy-tests/cardfx.txt
          PYTHONPATH=src python saveload_fuzz.py --seeds 4 --max-steps 8000 | tee /tmp/inferno-strategy-tests/saveload.txt
          PYTHONPATH=src python robustness_fuzz.py --seeds 2 --max-steps 6000 --probe-every 8 | tee /tmp/inferno-strategy-tests/robustness.txt
          PYTHONPATH=src python state_injection_fuzz.py --seeds 1 --max-steps 400 --probe-every 60 | tee /tmp/inferno-strategy-tests/injection.txt
      - name: Commit tested code, remove transport
        run: |
          set -euo pipefail
          git rm .strategy/part*.b64 .strategy/ready.txt .github/workflows/strategy-verification.yml
          git add CHATGPT_SETUP.md LLM_PLAY_GUIDE.md STRATEGIC_OPTIMIZATION.md benchmarks/strategy_ab.py benchmarks/strategy_memory_overhead.py examples/play_with_claude.py src/inferno/llm tests/test_strategic_memory.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: preserve per-faction strategic intent and add paired evaluation'
          git push origin HEAD:feature/inferno-strategic-continuity-20261016
          git log -1 --format='%H %s' | tee /tmp/inferno-strategy-tests/commit.txt
          git diff --stat 75ee4220ecbc363d1d295411cedadbaad8320bc4 HEAD | tee /tmp/inferno-strategy-tests/changes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: inferno-strategy-evaluation
          path: /tmp/inferno-strategy-tests
          retention-days: 7
