name: Apply and verify Inferno audit fixes
on:
  push:
    branches: [fix/inferno-audit-20261009]
    paths: [.github/workflows/audit-workspace.yml]
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply reviewed patch
        run: |
          mkdir -p /tmp/inferno-tests
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          chunks = sorted(Path('.audit').glob('patch.*.b64'))
          assert len(chunks) == 4, chunks
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in chunks), validate=True))
          expected = '78a8d3d0d93fc064522324cf7e6373e0e9c38fde6f9b7e88052185586f023ea0'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch checksum mismatch'
          Path('/tmp/inferno-audit.patch').write_bytes(patch)
          print('Verified patch:', len(patch), 'bytes;', expected)
          PY
          git apply --check /tmp/inferno-audit.patch
          git apply /tmp/inferno-audit.patch
          git diff --check
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile and run complete test suite
        run: |
          set -o pipefail
          python -m compileall -q src examples
          python -m pytest -q --junitxml=/tmp/inferno-tests/pytest.xml 2>&1 | tee /tmp/inferno-tests/pytest.txt
      - name: Self-play all six scenarios
        run: |
          set -euo pipefail
          for scen in A B C D E F; do
            PYTHONPATH=src python selfplay_bughunt.py "$scen" --seed 11 --max-steps 8000 2>&1 | tee "/tmp/inferno-tests/smoke-$scen.txt"
          done
      - name: Card-effect integration stress
        run: |
          set -o pipefail
          PYTHONPATH=src python cardfx_fuzz.py --seeds 6 2>&1 | tee /tmp/inferno-tests/cardfx.txt
      - name: Save-load and replay stress
        run: |
          set -o pipefail
          PYTHONPATH=src python saveload_fuzz.py --seeds 8 --max-steps 8000 2>&1 | tee /tmp/inferno-tests/saveload.txt
      - name: Malformed-input stress
        run: |
          set -o pipefail
          PYTHONPATH=src python robustness_fuzz.py --seeds 3 --max-steps 6000 --probe-every 8 2>&1 | tee /tmp/inferno-tests/robustness.txt
      - name: Invariant injection stress
        run: |
          set -o pipefail
          PYTHONPATH=src python state_injection_fuzz.py --seeds 2 --max-steps 400 --probe-every 60 2>&1 | tee /tmp/inferno-tests/injection.txt
      - name: Commit tested fixes and remove transfer files
        run: |
          git rm .audit/patch.*.b64 .github/workflows/audit-workspace.yml
          git add ACTIONS.md AUDIT_FIXES.md cardfx_fuzz.py examples/play_with_claude.py pyproject.toml src/inferno tests
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: resolve 22 Inferno audit findings with regression coverage'
          git push origin HEAD:fix/inferno-audit-20261009
          git log -1 --format=fuller | tee /tmp/inferno-tests/commit.txt
          git diff --stat 9c505c76481e2d5cce32f65a61717670a625c690 HEAD | tee /tmp/inferno-tests/changes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inferno-audit-verification
          path: /tmp/inferno-tests
          retention-days: 7
