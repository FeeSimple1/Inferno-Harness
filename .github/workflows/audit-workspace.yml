name: Inferno audit workspace
on:
  push:
    branches: [fix/inferno-audit-20261009]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD > /tmp/inferno-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: inferno-source
          path: /tmp/inferno-source.tar
          retention-days: 1
