name: Verify complete Inferno LLM interface
on:
  push:
    branches: [fix/seed-20261012-and-interface-20261016]
    paths: [.github/workflows/interface-workspace.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply frozen source patches
        run: |
          mkdir -p /tmp/interface-verification
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          chunks = sorted(Path('.interface-transfer').glob('patch.*.b64'))
          assert len(chunks) == 8, len(chunks)
          transfers = [
              ('interface', ''.join(p.read_text().strip() for p in chunks), '5df53fdd580d8572d54cd557e029d652ac8e6f024711cb7ffe5e7728e38e4cb1'),
              ('example', Path('.interface-transfer/example.b64').read_text().strip(), '1601a0a01116cca6abef7458b8412669771f3fd01deb3be584f34dd19dd746be'),
          ]
          for name, encoded, expected in transfers:
              patch = lzma.decompress(base64.b64decode(encoded, validate=True))
              digest = hashlib.sha256(patch).hexdigest()
              assert digest == expected, (name, digest, expected)
              Path('/tmp/interface-verification', name + '.patch').write_bytes(patch)
              print(name, len(patch), digest)
          PY
          git apply --check /tmp/interface-verification/interface.patch
          git apply /tmp/interface-verification/interface.patch
          git apply --check /tmp/interface-verification/example.patch
          git apply /tmp/interface-verification/example.patch
          git diff --check
      - name: Install full testing and token measurement dependencies
        run: python -m pip install -e '.[dev]' tiktoken
      - name: Compile and run complete regression suite
        run: |
          set -euo pipefail
          python -m compileall -q src examples benchmarks
          python -m pytest -q --junitxml=/tmp/interface-verification/pytest.xml 2>&1 | tee /tmp/interface-verification/pytest.txt
      - name: Self-play all six scenarios
        run: |
          set -euo pipefail
          for scen in A B C D E F; do
            PYTHONPATH=src python selfplay_bughunt.py "$scen" --seed 11 --max-steps 8000 2>&1 | tee "/tmp/interface-verification/smoke-$scen.txt"
          done
      - name: Card-effect integration stress
        run: |
          set -euo pipefail
          PYTHONPATH=src python cardfx_fuzz.py --seeds 6 2>&1 | tee /tmp/interface-verification/cardfx.txt
      - name: Save-load and replay stress
        run: |
          set -euo pipefail
          PYTHONPATH=src python saveload_fuzz.py --seeds 8 --max-steps 8000 2>&1 | tee /tmp/interface-verification/saveload.txt
      - name: Malformed-input stress
        run: |
          set -euo pipefail
          PYTHONPATH=src python robustness_fuzz.py --seeds 3 --max-steps 6000 --probe-every 8 2>&1 | tee /tmp/interface-verification/robustness.txt
      - name: Invariant injection stress
        run: |
          set -euo pipefail
          PYTHONPATH=src python state_injection_fuzz.py --seeds 2 --max-steps 400 --probe-every 60 2>&1 | tee /tmp/interface-verification/injection.txt
      - name: Measure complete play sequences with all extra lookups
        run: |
          set -euo pipefail
          PYTHONPATH=src python benchmarks/interface_output.py --tokens --out /tmp/interface-verification/interface-output.json 2>&1 | tee /tmp/interface-verification/benchmark.txt
          python benchmarks/report_output.py /tmp/interface-verification/interface-output.json --pytest /tmp/interface-verification/pytest.xml --out benchmarks/results | tee /tmp/interface-verification/INTERFACE_OUTPUT.md
          cp benchmarks/results/interface-output.summary.json /tmp/interface-verification/
      - name: Commit verified interface and measurements
        run: |
          git rm .interface-transfer/*.b64 .github/workflows/interface-workspace.yml
          git add ACTIONS.md CHATGPT_SETUP.md LLM_INTERFACE_CHANGES.md LLM_PLAY_GUIDE.md README.md benchmarks examples/play_with_claude.py src/inferno tests
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add complete versioned LLM discovery and measured output transport'
          git push origin HEAD:fix/seed-20261012-and-interface-20261016
          git log -1 --format=fuller | tee /tmp/interface-verification/commit.txt
          git diff --stat 4cda8cfe87d1827a4e5f235f337e68aef1e1c2c8 HEAD | tee /tmp/interface-verification/changes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inferno-interface-verification
          path: /tmp/interface-verification
          retention-days: 7
