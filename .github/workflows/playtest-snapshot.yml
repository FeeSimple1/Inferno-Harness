name: Playtest source snapshot
on:
  push:
    branches: [playtest/quick-selfplay-20261009]
    paths: [.github/workflows/playtest-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b7cc7c533b1da13e87f0ed86dc4414a3ff13fef9
      - run: git archive --format=tar HEAD > /tmp/inferno-current.tar
      - uses: actions/upload-artifact@v4
        with:
          name: inferno-current-source
          path: /tmp/inferno-current.tar
          retention-days: 1
