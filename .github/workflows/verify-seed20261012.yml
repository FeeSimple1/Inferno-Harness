name: Verify Scenario F seed repairs

on:
  push:
    branches: [fix/seed-20261012-regressions]
    paths: [.github/workflows/verify-seed20261012.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify and apply both reviewed repair batches
        run: |
          mkdir -p /tmp/inferno-tests
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          chunks = sorted(Path('.audit').glob('seed20261012.*.b64'))
          assert len(chunks) == 8, chunks
          encoded = ''.join(p.read_text().strip() for p in chunks)
          assert len(encoded) == 74604, len(encoded)
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          expected = '4deaf1699a952d2d41a73a4fc5039113134c41c9305a3558cba40d2acc2487a2'
          assert hashlib.sha256(raw).hexdigest() == expected, 'Repair checksum mismatch'
          patches = json.loads(raw)
          assert set(patches) == {'prior.patch', 'seed.patch'}
          for name, text in patches.items():
              Path('/tmp', name).write_text(text)
          print('Verified both repair batches:', len(raw), 'bytes;', expected)
          PY
          git apply --check /tmp/prior.patch
          git apply /tmp/prior.patch
          git apply --check /tmp/seed.patch
          git apply /tmp/seed.patch
          git diff --check

      - name: Install complete test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Compile and run complete test suite
        run: |
          set -o pipefail
          python -m compileall -q src tests tools examples
          python -m pytest -q -o addopts= --junitxml=/tmp/inferno-tests/pytest.xml 2>&1 | tee /tmp/inferno-tests/pytest.txt

      - name: Self-play all six scenarios
        run: |
          set -euo pipefail
          for scenario in A B C D E F; do
            PYTHONPATH=src python selfplay_bughunt.py "$scenario" --seed 11 --max-steps 8000 2>&1 | tee "/tmp/inferno-tests/smoke-$scenario.txt"
          done

      - name: Card-effect integration stress
        run: |
          set -o pipefail
          PYTHONPATH=src python cardfx_fuzz.py --seeds 6 2>&1 | tee /tmp/inferno-tests/cardfx.txt

      - name: Sorted-JSON save-load and replay stress
        run: |
          set -o pipefail
          PYTHONPATH=src python saveload_fuzz.py --seeds 8 --max-steps 8000 2>&1 | tee /tmp/inferno-tests/saveload.txt

      - name: Malformed-input stress
        run: |
          set -o pipefail
          PYTHONPATH=src python robustness_fuzz.py --seeds 3 --max-steps 6000 --probe-every 8 2>&1 | tee /tmp/inferno-tests/robustness.txt

      - name: Invariant injection stress
        run: |
          set -o pipefail
          PYTHONPATH=src python state_injection_fuzz.py --seeds 2 --max-steps 400 --probe-every 60 2>&1 | tee /tmp/inferno-tests/injection.txt

      - name: Replay all 1731 actions without reloads
        run: |
          set -o pipefail
          PYTHONHASHSEED=1 python tools/replay_seed20261012.py 2>&1 | tee /tmp/inferno-tests/replay-uninterrupted.txt

      - name: Independently replay with repeated save-reloads
        run: |
          set -o pipefail
          PYTHONHASHSEED=917 python tools/replay_seed20261012.py --reload-every 40 2>&1 | tee /tmp/inferno-tests/replay-reloads.txt

      - name: Commit tested fixes and remove transfer files
        run: |
          git rm .audit/seed20261012.*.b64 .github/workflows/verify-seed20261012.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: resolve seed-20261012 regressions and publish long-game repairs'
          git push origin HEAD:fix/seed-20261012-regressions
          git log -1 --format=fuller | tee /tmp/inferno-tests/commit.txt
          git diff --stat 60da72b8265e4d5e797d56499dec88046a852853 HEAD | tee /tmp/inferno-tests/changes.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-f-seed-fix-verification
          path: /tmp/inferno-tests
          retention-days: 7
