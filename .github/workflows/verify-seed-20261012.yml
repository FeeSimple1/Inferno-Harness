name: Verify Scenario F endurance repairs

on:
  push:
    branches: [fix/seed-20261012-endurance]
    paths: [.github/workflows/verify-seed-20261012.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify and apply repair payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/inferno-repairs /tmp/inferno-results
          cat .repair/patch.*.b64 | tr -d '\n' | base64 --decode > /tmp/inferno-repairs.tar.xz
          echo '5f3a28968a3156342077172ca15cfcd9effdb35a1b89d47d4ad84f8d3fb4331e  /tmp/inferno-repairs.tar.xz' | sha256sum --check
          tar -xJf /tmp/inferno-repairs.tar.xz -C /tmp/inferno-repairs
          cd /tmp/inferno-repairs
          sha256sum --check SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          git apply --check /tmp/inferno-repairs/01-long-scenario.patch
          git apply /tmp/inferno-repairs/01-long-scenario.patch
          git apply --check /tmp/inferno-repairs/02-seed-20261012.patch
          git apply /tmp/inferno-repairs/02-seed-20261012.patch
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_seed_20261012_fixes.py')
          path.write_text(path.read_text().rstrip() + '\n')
          PY
          git diff --check
          git diff --stat | tee /tmp/inferno-results/changes-before-tests.txt

      - name: Install complete test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Compile and run focused endurance regressions
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q src examples tests
          python -m pytest -q tests/test_long_scenario_fixes.py tests/test_seed_20261012_fixes.py 2>&1 | tee /tmp/inferno-results/endurance-regressions.txt

      - name: Run complete test suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=/tmp/inferno-results/pytest.xml 2>&1 | tee /tmp/inferno-results/pytest.txt

      - name: Self-play all six scenarios
        shell: bash
        run: |
          set -euo pipefail
          for scenario in A B C D E F; do
            PYTHONPATH=src python selfplay_bughunt.py "$scenario" --seed 11 --max-steps 8000 2>&1 | tee "/tmp/inferno-results/selfplay-${scenario}.txt"
          done

      - name: Card-effect integration stress
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python cardfx_fuzz.py --seeds 6 2>&1 | tee /tmp/inferno-results/cardfx.txt

      - name: Save-load and replay stress
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python saveload_fuzz.py --seeds 8 --max-steps 8000 2>&1 | tee /tmp/inferno-results/saveload.txt

      - name: Malformed-input stress
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python robustness_fuzz.py --seeds 3 --max-steps 6000 --probe-every 8 2>&1 | tee /tmp/inferno-results/robustness.txt

      - name: Invariant-injection stress
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python state_injection_fuzz.py --seeds 2 --max-steps 400 --probe-every 60 2>&1 | tee /tmp/inferno-results/injection.txt

      - name: Commit and push verified repairs
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .repair .github/workflows/verify-seed-20261012.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: resolve Scenario F endurance and replay defects'
          git push origin HEAD:fix/seed-20261012-endurance
          git log -1 --format=fuller | tee /tmp/inferno-results/commit.txt
          git diff --stat 60da72b8265e4d5e797d56499dec88046a852853 HEAD | tee /tmp/inferno-results/final-changes.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-f-endurance-verification
          path: /tmp/inferno-results
          retention-days: 7
