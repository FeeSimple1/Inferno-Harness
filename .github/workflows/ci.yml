name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests + self-play smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable + dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Self-play smoke (all six scenarios, anomalies fail the build)
        run: |
          set -e
          for scen in A B C D E F; do
            echo "::group::Self-play scenario $scen"
            PYTHONPATH=src python selfplay_bughunt.py "$scen" --seed 11 --max-steps 8000
            echo "::endgroup::"
          done

      - name: Card-effect integration fuzz (crossbow / array / sally channels)
        run: PYTHONPATH=src python cardfx_fuzz.py --seeds 6

      - name: Save/load + replay determinism fuzz
        run: PYTHONPATH=src python saveload_fuzz.py --seeds 8 --max-steps 8000

      - name: Adversarial-input robustness fuzz (dispatch contract)
        run: PYTHONPATH=src python robustness_fuzz.py --seeds 3 --max-steps 6000 --probe-every 8
